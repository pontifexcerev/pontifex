<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PONTIFEX content editor</title><meta name="robots" content="noindex">
<link rel="icon" href="app-icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121318;--p:#1B1D24;--p2:#252833;--bd:#30333D;--tx:#F4F1EA;--mu:#A7A9B4;--pri:#A78BFA;--sec:#6FC7C2;--acc:#F2A98F;--on:#121318;color-scheme:dark}
:root[data-theme="light"]{--bg:#FAF8F4;--p:#FFFFFF;--p2:#F1EFEB;--bd:#E2DED8;--tx:#25252B;--mu:#77777F;--pri:#7659B8;--sec:#397F7A;--acc:#C86F55;--on:#FFFFFF;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.6 Inter,system-ui,sans-serif}
.w{max-width:980px;margin:auto;padding:22px 18px 80px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}header img{height:34px}header h1{font:600 24px 'Space Grotesk',sans-serif;margin:0;flex:1}
h2{font:600 17px 'Space Grotesk',sans-serif;margin:0 0 6px}p{margin:0 0 10px;color:var(--mu)}.c{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin-bottom:16px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:9px 14px;font:500 14px Inter;cursor:pointer}.tabs button.on{color:var(--tx);border-color:var(--pri)}
label{display:block;font:600 12px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font:inherit}textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.g2{grid-template-columns:1fr}}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:10px 18px;font:600 14px Inter;cursor:pointer}.btn.s{background:var(--sec)}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.d{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:5px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.it{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-top:8px;background:var(--p2)}.it b{font-weight:600}.it small{color:var(--mu);display:block}.it>div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{font:600 11px Inter;border:1px solid var(--bd);border-radius:999px;padding:3px 9px;color:var(--sec);text-transform:uppercase;letter-spacing:.06em}
#st{position:sticky;bottom:12px;margin-top:12px;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--p2);display:none}#st.on{display:block}#st.ok{border-color:var(--sec)}#st.er{border-color:var(--acc)}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:26px;text-align:center;color:var(--mu);cursor:pointer}.drop.hov{border-color:var(--pri);color:var(--tx)}
code{background:var(--p2);padding:1px 6px;border-radius:6px;font-size:13px}.m{font-family:ui-monospace,monospace;font-size:13px}
</style></head><body><div class="w">
<header><img src="logo-white.png" id="lg" alt="PONTIFEX"><h1>Content editor</h1><button class="btn o" id="th">Theme</button></header>
<div class="c"><h2>1. Connect to GitHub</h2><p>Needed only for publishing and uploading PDFs. Your token stays in this browser tab and is never saved in the site. Use a fine-grained token limited to this one repository with <b>Contents: Read and write</b>.</p>
<div class="g2"><div><label for="ow">GitHub username</label><input id="ow" placeholder="your-username" autocomplete="off"></div><div><label for="rp">Repository</label><input id="rp" placeholder="pontifex" autocomplete="off"></div><div><label for="br">Branch</label><input id="br" value="main"></div><div><label for="tk">Token</label><input id="tk" type="password" placeholder="github_pat_..." autocomplete="off"></div></div>
<div class="row"><button class="btn" id="ld">Load content.json from GitHub</button><button class="btn o" id="ls">Load from this site instead</button></div></div>
<div class="tabs" role="tablist"><button class="on" data-t="les">Lessons</button><button data-t="res">Resources</button><button data-t="car">Flashcards</button><button data-t="qb">Question bank</button><button data-t="fil">PDF uploader</button><button data-t="pub">Publish</button></div>
<div id="v"></div><div id="st" role="status"></div></div>
<script>
const T={"b": [{"id": "PSAD", "n": "Principles of Structural Analysis and Design", "tp": ["Engineering mechanics", "Strength of materials", "Theory of structures", "Reinforced concrete beams and columns", "Prestressed concrete beams", "Steel beams, columns, and connections", "Footings", "Construction materials testing", "Governing codes of practice (NSCP)"]}, {"id": "MSTHC", "n": "Applied Mathematics, Surveying, Principles of Transportation and Highway Engineering, Construction Management and Methods", "tp": ["Basic Mathematics", "Calculus", "Differential equations", "Engineering data analysis", "Physics for engineers", "Engineering economics", "Construction surveying and layout", "Materials for construction", "Highway engineering", "Construction occupational safety and health", "Transportation engineering", "Quantity surveying", "Construction management principles and methods"]}, {"id": "HGE", "n": "Hydraulics and Principles of Geotechnical Engineering", "tp": ["Fluid properties", "Hydrostatics", "Fluid flow", "Hydrodynamics", "Water supply", "Soil properties and classification", "Fluid flow through soil mass", "Stresses in soil mass", "Soil strength and tests", "Bearing capacity", "Compaction", "Consolidation and settlement", "Lateral earth pressures", "Slope stability"]}], "h": [{"k": "h0", "n": "Mathematics", "tp": ["Algebra", "Trigonometry", "Geometry", "Calculus", "Engineering economics", "Probability and statistics"]}, {"k": "h1", "n": "Foundation", "tp": ["Physics", "Mechanics", "Statics", "Strength of materials"]}, {"k": "h2", "n": "Surveying", "tp": ["Elementary surveying", "Route surveying"]}, {"k": "h3", "n": "Structural", "tp": ["Structural theory", "Reinforced concrete design", "Steel design"]}, {"k": "h4", "n": "Fluids", "tp": ["Fluid mechanics", "Hydraulics"]}, {"k": "h5", "n": "Geotechnical", "tp": ["Soil mechanics", "Geotechnical engineering"]}, {"k": "h6", "n": "Highway and traffic", "tp": ["Highway engineering", "Traffic engineering"]}, {"k": "h7", "n": "Transportation", "tp": ["Transportation engineering"]}, {"k": "h8", "n": "Construction", "tp": ["Construction methods", "Project management"]}, {"k": "h9", "n": "Laws and ethics", "tp": ["Laws", "Contracts and specifications", "Professional ethics"]}]};
const RT=[['mod','Module'],['set','Problem set'],['vid','Video'],['code','Code reference'],['tbl','Table or chart']];
let C={lessons:[],resources:[],cards:[],questions:[]},tab='les',files=[],figs=[],QP=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
function say(m,k){const e=$('#st');e.textContent=m;e.className='on '+(k||'');}
const SUBS=[...T.b.map(x=>({v:x.id,l:x.id+' · '+x.n.slice(0,48),tp:x.tp,b:1})),...T.h.map(x=>({v:x.k,l:'Collegiate · '+x.n,tp:x.tp,b:0}))];
const subOpts=(lib)=>SUBS.map(s=>`<option value="${s.v}">${esc(s.l)}</option>`).join('')+(lib?'<option value="lib">Library (all subjects)</option>':'');
const topOpts=v=>{const s=SUBS.find(x=>x.v==v);return s?s.tp.map((t,i)=>`<option value="${i}">${esc(t)}</option>`).join(''):'<option value="0">General</option>'};
function put(sub,o,topicIdx){const s=SUBS.find(x=>x.v==sub);if(!s){o.s='lib';o.t=0;return o}if(s.b){o.subject=s.v;o.topic=s.tp[topicIdx]}else{o.s=s.v;o.t=+topicIdx}return o}
function fileOpts(){return '<option value="">No file</option>'+files.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('')}
function view(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));const v=$('#v');
 if(tab=='les')v.innerHTML=`<div class="c"><h2>Add a lesson</h2><p>Video and PDF are optional, but a lesson needs at least one.</p><div class="g2"><div><label>Subject</label><select id="a_s" onchange="$('#a_t').innerHTML=topOpts(this.value)">${subOpts()}</select></div><div><label>Topic</label><select id="a_t">${topOpts(SUBS[0].v)}</select></div></div><label>Title</label><input id="a_ti" maxlength="140"><label>Summary</label><textarea id="a_su"></textarea><div class="g2"><div><label>Video link (https://)</label><input id="a_v" placeholder="YouTube or Drive link"></div><div><label>PDF path or link</label><input id="a_p" list="fl" placeholder="files/lesson-1.pdf"><datalist id="fl">${files.map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div></div><div class="row"><button class="btn" onclick="addL()">Add lesson</button></div></div>`+list('lessons');
 else if(tab=='res')v.innerHTML=`<div class="c"><h2>Add a resource</h2><p>Modules, problem sets, videos, code references, and tables appear under the matching tab of each subject.</p><div class="g2"><div><label>Type</label><select id="r_k">${RT.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div><div><label>Subject</label><select id="r_s" onchange="$('#r_t').innerHTML=topOpts(this.value)">${subOpts(1)}</select></div><div><label>Topic</label><select id="r_t">${topOpts(SUBS[0].v)}</select></div><div><label>Link or PDF path</label><input id="r_u" list="fl" placeholder="files/problem-set-1.pdf or https://..."><datalist id="fl">${files.map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div></div><label>Title</label><input id="r_ti" maxlength="140"><label>Note (optional)</label><textarea id="r_n"></textarea><div class="row"><button class="btn" onclick="addR()">Add resource</button></div></div>`+list('resources');
 else if(tab=='car')v.innerHTML=`<div class="c"><h2>Add a flashcard</h2><p>Board review subjects only (PSAD, MSTHC, HGE).</p><div class="g2"><div><label>Subject</label><select id="f_s">${T.b.map(x=>`<option>${x.id}</option>`).join('')}</select></div><div><label>Type</label><select id="f_k"><option value="term">Term</option><option value="formula">Formula</option></select></div></div><label>Front</label><textarea id="f_f" maxlength="400"></textarea><label>Back</label><textarea id="f_b" maxlength="400"></textarea><div class="row"><button class="btn" onclick="addC()">Add flashcard</button></div></div>`+list('cards');

 else if(tab=='qb')v.innerHTML=qbView();
 else if(tab=='fil')v.innerHTML=`<div class="c"><h2>PDF uploader</h2><p>Uploads go to the <code>files/</code> folder of your repository. Then pick the file in a lesson or resource. Needs the GitHub connection above.</p><div class="drop" id="dz" tabindex="0">Drop PDFs here or click to choose</div><input type="file" id="fi" accept="application/pdf,image/*" multiple hidden><div id="fq"></div></div><div class="c"><h2>Files in this session</h2>${files.length?files.map(f=>`<div class="it"><div class="m">${esc(f)}</div><span class="tag">ready</span></div>`).join(''):'<p>Nothing uploaded yet.</p>'}</div>`;
 else v.innerHTML=`<div class="c"><h2>Publish</h2><p>${C.lessons.length} lessons, ${C.resources.length} resources, ${C.cards.length} flashcards, ${C.questions.length} questions.</p><div class="row"><button class="btn s" id="pb">Commit content.json to GitHub</button><button class="btn o" id="dl">Download content.json</button><button class="btn o" id="cp">Copy JSON</button></div><p style="margin-top:12px">Without a token, download the file and upload it with <b>Add file → Upload files</b> on GitHub. Changes go live in a minute or two.</p></div><div class="c"><h2>Preview</h2><pre class="m" style="white-space:pre-wrap;max-height:320px;overflow:auto;margin:0">${esc(JSON.stringify(out(),null,2))}</pre></div>`;
 wire()}
function list(k){const a=C[k];return `<div class="c"><h2>Existing ${k} (${a.length})</h2>${a.length?a.map((x,i)=>`<div class="it"><div><b>${esc(x.title||x.front)}</b><small>${esc(x.subject||x.s||'')} ${x.topic?'· '+esc(x.topic):''} ${x.type?'· '+esc(x.type):''}</small></div><button class="btn d" onclick="del('${k}',${i})">Remove</button></div>`).join(''):'<p>None yet.</p>'}</div>`}
function del(k,i){if(confirm('Remove this entry?')){C[k].splice(i,1);view();say('Removed. Remember to publish.','ok')}}
const val=s=>($(s)||{}).value?.trim()||'';
function addL(){const t=val('#a_ti');if(!t)return say('Add a title.','er');const v=val('#a_v'),p=val('#a_p');if(!v&&!p)return say('Add a video link or a PDF.','er');if(v&&!/^https:\/\//.test(v))return say('The video link must start with https://','er');
 const o=put(val('#a_s'),{id:slug(val('#a_s')+'-'+t),title:t,summary:val('#a_su')},val('#a_t'));if(v)o.video=v;if(p)o.pdf=p;C.lessons.push(o);view();say('Lesson added. Publish when ready.','ok')}
function addR(){const t=val('#r_ti'),u=val('#r_u');if(!t||!u)return say('Add a title and a link or PDF path.','er');
 const o=put(val('#r_s'),{id:slug(val('#r_s')+'-'+t),title:t,type:{mod:'module',set:'problem set',vid:'video',code:'reference',tbl:'table'}[val('#r_k')],url:u,note:val('#r_n')},val('#r_t'));C.resources.push(o);view();say('Resource added. Publish when ready.','ok')}
function addC(){const f=val('#f_f'),b=val('#f_b');if(!f||!b)return say('Fill in both sides.','er');C.cards.push({id:slug(val('#f_s')+'-'+f),subject:val('#f_s'),type:val('#f_k'),front:f,back:b});view();say('Flashcard added. Publish when ready.','ok')}
const out=()=>({_help:'Lessons, modules, problem sets, library items and flashcards are listed here. Use content-editor.html to add entries safely.',lessons:C.lessons,resources:C.resources,cards:C.cards,questions:C.questions});
const gh=()=>({o:val('#ow'),r:val('#rp'),b:val('#br')||'main',t:$('#tk').value.trim()});
async function api(path,opt={}){const g=gh();if(!g.o||!g.r||!g.t)throw new Error('Fill in username, repository and token first.');const r=await fetch(`https://api.github.com/repos/${g.o}/${g.r}/contents/${path}`+(opt.method=='PUT'?'':`?ref=${g.b}`),{...opt,headers:{Authorization:'Bearer '+g.t,Accept:'application/vnd.github+json','Content-Type':'application/json'}});if(!r.ok&&r.status!=404)throw new Error('GitHub said '+r.status+'. Check the token and repository.');return r}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function put2(path,content64,msg){const g=gh();let sha;const ex=await api(path);if(ex.ok)sha=(await ex.json()).sha;const r=await api(path,{method:'PUT',body:JSON.stringify({message:msg,content:content64,branch:g.b,sha})});if(!r.ok)throw new Error('Upload failed ('+r.status+').');return r}
function norm(d){C={lessons:d.lessons||[],resources:d.resources||[],cards:d.cards||[],questions:d.questions||[]}}

const QCOLS=['subject','topic','question','a','b','c','d','answer','explanation','image'];
const figName=n=>String(n||'').trim().split('/').pop().toLowerCase().replace(/[^a-z0-9._-]+/g,'-');
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else f+=c}
 r.push(f);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}
function csvRows(text){const rows=parseCSV(text);if(rows.length<2)return[];const h=rows[0].map(x=>x.trim().toLowerCase().replace(/^(choice|option)[ _]?/,''));
 return rows.slice(1).map((r,i)=>{const o={};h.forEach((k,j)=>o[k]=(r[j]||'').trim());o._n=i+2;return o})}
function checkRow(o){const er=[],sb=T.b.find(x=>x.id==String(o.subject||'').toUpperCase());
 if(!sb)er.push('Subject must be PSAD, MSTHC, or HGE');
 let tj=-1;if(sb){tj=sb.tp.findIndex(t=>t.toLowerCase()==String(o.topic||'').toLowerCase());if(tj<0)er.push('Topic "'+(o.topic||'')+'" is not one of the '+sb.id+' topics')}
 if(!o.question)er.push('Question is empty');
 const ch=['a','b','c','d'].map(k=>o[k]||'').filter(Boolean);if(ch.length<2)er.push('Needs at least two choices');
 let ans=String(o.answer||'').trim().toUpperCase();if(/^[1-4]$/.test(ans))ans='ABCD'[+ans-1];
 if(!/^[A-D]$/.test(ans)||'ABCD'.indexOf(ans)>=ch.length)er.push('Answer must be A, B, C, or D and match a filled choice');
 const im=String(o.image||'').split('|').map(figName).filter(Boolean),miss=figs.length?im.filter(n=>!figs.includes('files/figures/'+n)):[];
 if(miss.length)er.push('Figure not uploaded yet: '+miss.join(', '));
 const ok=!er.length;
 return{ok,er,q:ok?{id:slug(sb.id+'-'+o.question).slice(0,60)+'-'+(hash(o.question)),subject:sb.id,topic:sb.tp[tj],question:o.question,choices:['a','b','c','d'].map(k=>o[k]||'').filter(Boolean),answer:ans,explanation:o.explanation||'',image:im.map(n=>'files/figures/'+n)}:null}}
const hash=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return (h>>>0).toString(36)};
function qbView(){
 const bad=QP.filter(x=>!x.ok).length,good=QP.length-bad;
 return `<div class="c"><h2>1. Upload figures first</h2><p>Diagrams, graphs, and pictures that go with questions. Pick as many images as you need (PNG, JPG, WebP, GIF, or SVG). They are saved to <code>files/figures/</code> in your repository, and large images are shrunk to 1400 px wide automatically. Needs the GitHub connection above.</p><div class="drop" id="fz" tabindex="0">Drop figure images here or click to choose</div><input type="file" id="ff" accept="image/*" multiple hidden><p class="m" style="margin-top:10px">${figs.length?figs.length+' figure(s) known: '+figs.slice(0,12).map(f=>esc(f.split('/').pop())).join(', ')+(figs.length>12?'…':''):'No figures loaded yet. Click "Load content.json from GitHub" above to list the ones already uploaded.'}</p></div>
 <div class="c"><h2>2. Import a CSV of questions</h2><p>Columns: <code>subject, topic, question, a, b, c, d, answer, explanation, image</code>. Subject is PSAD, MSTHC, or HGE. The topic must match one of that subject's topics exactly. Answer is A, B, C, or D. For a figure, type the image file name in the <code>image</code> column (for example <code>fig-12.png</code>). Use <code>|</code> between several images. Image and explanation are optional.</p><div class="row"><button class="btn o" id="qt">Download CSV template</button><button class="btn o" id="qtp">See the topic names</button><input type="file" id="qf" accept=".csv,text/csv" style="max-width:320px"></div><div id="qtopics"></div>
 ${QP.length?`<p style="margin-top:14px"><b>${good}</b> ready, <b style="color:var(--acc)">${bad}</b> with problems.</p><div style="max-height:320px;overflow:auto">${QP.map(x=>`<div class="it"><span class="tag" style="color:${x.ok?'var(--sec)':'var(--acc)'}">${x.ok?'ok':'fix'}</span><div><b>Row ${x.n}: ${esc((x.raw.question||'').slice(0,90))}</b><small>${x.ok?esc(x.q.subject+' · '+x.q.topic+(x.q.image.length?' · '+x.q.image.length+' figure(s)':'')):esc(x.er.join('. '))}</small></div></div>`).join('')}</div><div class="row"><button class="btn s" id="qadd" ${good?'':'disabled'}>Add ${good} valid question(s)</button><button class="btn o" id="qclr">Clear preview</button></div>`:''}</div>
 <div class="c"><h2>3. Questions in the bank (${C.questions.length})</h2><p>New questions are added at the end. Avoid removing questions in the middle once students have used them, because their saved mistakes and bookmarks are matched by position.</p>${C.questions.length?C.questions.slice(-30).reverse().map((x,i)=>{const k=C.questions.length-1-i;return `<div class="it"><div><b>${esc(x.question.slice(0,100))}</b><small>${esc(x.subject)} · ${esc(x.topic)}${x.image&&x.image.length?' · '+x.image.length+' figure(s)':''}</small></div><button class="btn d" onclick="delQ(${k})">Remove</button></div>`}).join('')+(C.questions.length>30?'<p>Showing the latest 30.</p>':''):'<p>None yet.</p>'}</div>`}
function delQ(k){if(confirm('Remove this question?')){C.questions.splice(k,1);view();say('Removed. Remember to publish.','ok')}}
async function shrink(f){if(!/^image\/(png|jpeg|webp)$/.test(f.type))return new Uint8Array(await f.arrayBuffer());
 const bm=await createImageBitmap(f);if(bm.width<=1400)return new Uint8Array(await f.arrayBuffer());
 const c=document.createElement('canvas');c.width=1400;c.height=Math.round(bm.height*1400/bm.width);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 const bl=await new Promise(r=>c.toBlob(r,f.type=='image/png'?'image/png':'image/jpeg',.9));return new Uint8Array(await bl.arrayBuffer())}
async function upFigs(list){for(const f of list){const n=figName(f.name),path='files/figures/'+n;if(f.size>25*1024*1024){say(f.name+' is over 25 MB.','er');continue}
 try{say('Uploading '+n+'...');const buf=await shrink(f);let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));await put2(path,btoa(bin),'Upload figure '+n);if(!figs.includes(path))figs.push(path);say('Uploaded '+n,'ok')}catch(e){say(e.message,'er')}}
 if(QP.length)QP=QP.map(x=>{const r=checkRow(x.raw);return{...r,raw:x.raw,n:x.n}});view()}
function qwire(){const fz=$('#fz');if(!fz)return;const ff=$('#ff');fz.onclick=()=>ff.click();fz.onkeydown=e=>{if(e.key=='Enter')ff.click()};['dragover','dragenter'].forEach(n=>fz.addEventListener(n,e=>{e.preventDefault();fz.classList.add('hov')}));['dragleave','drop'].forEach(n=>fz.addEventListener(n,e=>{e.preventDefault();fz.classList.remove('hov')}));fz.addEventListener('drop',e=>upFigs(e.dataTransfer.files));ff.onchange=()=>upFigs(ff.files);
 $('#qt').onclick=()=>{const t=QCOLS.join(',')+'\nPSAD,Engineering mechanics,"A 10 kN force acts 30 degrees above the horizontal. What is its horizontal component?",5.00 kN,8.66 kN,10.00 kN,17.32 kN,B,"Fx = 10 cos 30 = 8.66 kN",\nHGE,Hydrostatics,"Find the hydrostatic force on the gate shown in the figure.",12 kN,24 kN,36 kN,48 kN,C,"F = gamma h_cg A",hydrostatic-gate.png\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='question-template.csv';a.click()};
 $('#qtp').onclick=()=>{$('#qtopics').innerHTML=T.b.map(x=>`<p class="m"><b>${x.id}</b>: ${x.tp.map(esc).join(' | ')}</p>`).join('')};
 $('#qf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=csvRows(await f.text());if(!rows.length){say('No rows found. Check the header row.','er');return}QP=rows.map(o=>{const r=checkRow(o);return{...r,raw:o,n:o._n}});view();say(rows.length+' rows read.','ok')};
 if($('#qadd'))$('#qadd').onclick=()=>{const have=new Set(C.questions.map(x=>x.id));let n=0;QP.filter(x=>x.ok).forEach(x=>{if(!have.has(x.q.id)){C.questions.push(x.q);have.add(x.q.id);n++}});QP=QP.filter(x=>!x.ok);view();say(n+' question(s) added. Publish when ready.','ok')};
 if($('#qclr'))$('#qclr').onclick=()=>{QP=[];view()}}
async function wire(){
 qwire();
 if($('#pb')){$('#pb').onclick=async()=>{try{say('Committing...');await put2('content.json',b64(JSON.stringify(out(),null,2)+'\n'),'Update content.json from editor');say('Published. It goes live in a minute or two.','ok')}catch(e){say(e.message,'er')}};
  $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out(),null,2)+'\n'],{type:'application/json'}));a.download='content.json';a.click()};
  $('#cp').onclick=()=>navigator.clipboard.writeText(JSON.stringify(out(),null,2)).then(()=>say('Copied.','ok'))}
 if($('#dz')){const dz=$('#dz'),fi=$('#fi');dz.onclick=()=>fi.click();dz.onkeydown=e=>{if(e.key=='Enter')fi.click()};['dragover','dragenter'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('hov')}));['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('hov')}));dz.addEventListener('drop',e=>up(e.dataTransfer.files));fi.onchange=()=>up(fi.files)}}
async function up(list){for(const f of list){const name='files/'+f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');if(f.size>25*1024*1024){say(f.name+' is over 25 MB. Compress it first.','er');continue}
 try{say('Uploading '+f.name+'...');const buf=new Uint8Array(await f.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));await put2(name,btoa(bin),'Upload '+f.name);if(!files.includes(name))files.push(name);say('Uploaded '+name,'ok')}catch(e){say(e.message,'er')}}view()}
$('#ld').onclick=async()=>{try{say('Loading...');const r=await api('content.json');if(!r.ok){say('No content.json found yet. Starting fresh.');return}const j=await r.json();norm(JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))));
 const fl=await api('files');if(fl.ok)files=(await fl.json()).filter(x=>x.type=='file'&&x.name!='README.txt'&&x.name!='.gitkeep').map(x=>'files/'+x.name);const fg=await api('files/figures');if(fg.ok)figs=(await fg.json()).filter(x=>x.type=='file').map(x=>'files/figures/'+x.name);view();say('Loaded from GitHub.','ok')}catch(e){say(e.message,'er')}};
$('#ls').onclick=async()=>{try{const r=await fetch('content.json',{cache:'no-cache'});norm(await r.json());view();say('Loaded from this site.','ok')}catch(e){say('Could not load content.json from this site.','er')}};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view()});
$('#th').onclick=()=>{const l=document.documentElement.dataset.theme!='light';document.documentElement.dataset.theme=l?'light':'dark';$('#lg').src=l?'logo-black.png':'logo-white.png'};
const sv=['ow','rp','br'];sv.forEach(k=>{try{const x=localStorage.getItem('pxed:'+k);if(x)$('#'+k).value=x}catch(e){}$('#'+k).addEventListener('change',e=>{try{localStorage.setItem('pxed:'+k,e.target.value)}catch(_){}})});
view();
</script></body></html>
