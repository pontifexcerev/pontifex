<style>
:root{--bg:#02050b;--p:rgba(6,12,24,.74);--p2:rgba(11,20,38,.72);--bd:rgba(110,160,225,.15);--tx:#e4edfb;--mu:#8296b4;--ac:#A78BFA;--v:#a78bfa;--ok:#6FC7C2;--wn:#F2A98F;--glow:0 0 14px color-mix(in srgb,var(--ac) 45%,transparent);--grid:rgba(110,160,225,.045);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef2f7;--p:rgba(255,255,255,.75);--p2:rgba(230,236,245,.85);--bd:rgba(60,90,130,.2);--tx:#14213a;--mu:#5a6b85;--ac:#0e7490;--v:#4f46e5;--ok:#0f9f6e;--wn:#b7791f;--glow:none;--grid:rgba(60,90,130,.08)}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.65 Inter,system-ui,sans-serif;background-image:none;background-size:36px 36px;overflow:hidden}
.m{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#load{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#load h1{font-family:'Space Grotesk',sans-serif;font-weight:300;letter-spacing:.6em;margin:0 -.6em 0 0;font-size:clamp(22px,5vw,38px);opacity:0;animation:fi 1s forwards}
#load h1::after{display:none}
#ln{height:1px;width:0;background:var(--ac);box-shadow:var(--glow);transition:width .1s}
#ct{font-size:12px;color:var(--mu)}
@keyframes fi{to{opacity:1}}
#app{position:relative;z-index:1;display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100%}
#app.col{grid-template-columns:64px 1fr}
#top{grid-column:2;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bd);background:var(--p);backdrop-filter:blur(12px);overflow-x:auto;white-space:nowrap}
.sp{flex:1}.pt{font-size:13px;color:var(--mu)}
.chip{border:1px solid var(--bd);border-radius:999px;padding:3px 12px;font-size:13px;background:transparent;color:var(--tx)}
button.chip:hover{border-color:var(--ac)}
#side{grid-row:1/3;border-right:1px solid var(--bd);background:var(--p);backdrop-filter:blur(12px);display:flex;flex-direction:column;padding:10px;gap:2px;overflow-y:auto}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:.34em;font-size:13px;padding:10px 6px;color:var(--ac);text-shadow:var(--glow)}
.gl{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;font-size:11px;color:var(--mu);padding:14px 10px 4px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;padding:3px;margin:2px 0 4px}.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 4px;font-size:12.5px;color:var(--mu)}.seg button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--tx)}
.av{display:inline-flex;align-items:center;justify-content:center;border:2px solid;border-radius:50%;background:var(--p2);flex:none;padding:0}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:14px 0 22px}.pc{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:min(31%,180px);text-align:center;border:0;background:none}
.pb{width:100%;border:1px solid var(--bd);border-bottom:0;border-radius:12px 12px 0 0;background:var(--p);display:flex;justify-content:center;padding-top:10px;font:600 28px 'IBM Plex Mono',monospace;color:var(--ac)}
.pc.f1 .pb{box-shadow:var(--glow);border-color:var(--ac)}.crown{color:var(--wn);font-size:22px;line-height:1;margin-bottom:-2px}
.lbr:hover{background:var(--p2)}
h3.sub{font:600 18px 'Space Grotesk',Inter,sans-serif;letter-spacing:-.015em;margin:36px 0 16px;display:flex;align-items:center;gap:14px}h3.sub::after{content:"";flex:1;height:1px;background:var(--bd)}
textarea,select{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx);font:inherit;width:100%}textarea{min-height:170px}select option{background:var(--bg)}
button.c{color:inherit;font:inherit;cursor:pointer;width:100%;text-align:left}
#pm{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}#pm.open{display:flex}#pm .c{width:min(380px,92vw);background:var(--bg)}
#app.col .logo,#app.col .nl{display:none}
.nv{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;color:var(--mu);width:100%}
.nv:hover{color:var(--tx)}.nv.on{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--tx);box-shadow:inset 2px 0 var(--ac)}
.nv i{font-style:normal;width:20px;text-align:center;flex:none}
main{grid-column:2;overflow-y:auto;padding:22px 24px 90px}
h1{font:700 clamp(30px,4vw,40px)/1.1 'Space Grotesk',Inter,sans-serif;letter-spacing:-.03em;margin:0 0 14px}
h1::after{content:"";display:block;width:56px;height:3px;border-radius:3px;background:var(--ac);box-shadow:var(--glow);margin-top:12px}
h2.th{font:600 20px/1.3 'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:18px;padding-bottom:8px}
.tab{font-weight:500;border:0;background:none;padding:6px 14px;border-radius:8px;color:var(--mu);white-space:nowrap;transition:background .25s}
.tab:hover{color:var(--tx)}.tab.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--tx)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.c{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:16px;backdrop-filter:blur(10px)}
.c h3{margin:0 0 6px;font:600 16px/1.3 'Space Grotesk',Inter,sans-serif;letter-spacing:-.01em}.c p{margin:0 0 8px;color:var(--mu);font-size:14px}.c p:last-child{margin-bottom:0}
.btn{border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:10px;padding:8px 16px}
.btn:hover{box-shadow:var(--glow)}.btn.v{border-color:var(--v);background:color-mix(in srgb,var(--v) 14%,transparent)}
.lk{filter:blur(5px);pointer-events:none;user-select:none}
.ov{position:relative}.ov .gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:2}
.ring{width:96px;height:96px}
.big{font:600 32px 'IBM Plex Mono',monospace;margin:4px 0}
.bar{height:6px;border-radius:6px;background:var(--bd);overflow:hidden}.bar b{display:block;height:100%;background:var(--ac);width:0;transition:width 1.2s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}.sw:last-child{border-bottom:0}
input[type=checkbox],input[type=range]{accent-color:var(--ac)}input[type=checkbox]{width:18px;height:18px}
input[type=text]{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--tx);width:100%;font:inherit}
.bub{display:inline-flex;width:26px;height:26px;border:1px solid var(--bd);border-radius:50%;align-items:center;justify-content:center;font-size:12px;margin:2px;cursor:pointer}.bub.s{background:var(--ac);color:#000}
.mp{display:grid;grid-template-columns:1fr 300px;gap:14px}
.nd{cursor:pointer}.nd.pulse rect{animation:pl 2s infinite}
@keyframes pl{50%{opacity:.45}}
.mt{position:relative;padding:5px 0}.mt i{position:absolute;top:0;bottom:0;width:1px;background:var(--wn)}.mt i+i{background:var(--ok)}
:root[data-mode="col"]{--ac:#a78bfa;--v:#A78BFA}
:root[data-theme="light"][data-mode="col"]{--ac:#4f46e5;--v:#0e7490}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"])[data-mode="col"]{--ac:#4f46e5;--v:#0e7490}}
.c{position:relative;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .35s}
.c::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:transparent}
.c:hover::after{opacity:1}.g>.c:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.g>.c:nth-child(4n+1){border-radius:20px 4px 20px 4px}.g>.c:nth-child(4n+2){border-radius:4px 20px 4px 20px}.g>.c:nth-child(4n+3){border-radius:20px}.g>.c:nth-child(4n){border-radius:4px 20px 20px 4px}
@media(min-width:900px){.g.bento>.c:nth-child(5n+1){grid-column:span 2}}
.nv{transition:background .25s,color .25s,padding-left .25s}.nv:hover{padding-left:14px}
#main.in-sec{animation:secIn .6s cubic-bezier(.2,.7,.2,1)}#main.in-tab{animation:tabIn .4s cubic-bezier(.2,.7,.2,1)}
@keyframes secIn{from{opacity:0;transform:translateX(var(--dx,24px));filter:blur(4px)}}@keyframes tabIn{from{opacity:0;transform:translateY(10px)}}
.rv{opacity:0;transform:translateY(20px) scale(.985)}.rv.vis{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*45ms)}
#tp{position:fixed;top:0;left:0;height:2px;width:0;background:var(--ac);box-shadow:var(--glow);z-index:98;opacity:0;pointer-events:none}#tp.run{animation:tp .75s cubic-bezier(.3,.7,.2,1)}
@keyframes tp{0%{width:0;opacity:1}70%{width:85%;opacity:1}100%{width:100%;opacity:0}}
#ms{position:fixed;inset:0;z-index:97;background:var(--bg);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}#ms.run{animation:msA .95s ease}
#ms span{font:300 clamp(22px,5vw,40px) 'Space Grotesk',sans-serif;letter-spacing:.5em;color:var(--ac);text-shadow:var(--glow);margin-right:-.5em}
@keyframes msA{0%{opacity:0}35%{opacity:1}65%{opacity:1}100%{opacity:0}}
#ls{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);min-height:1.2em}#lbr .br{width:min(260px,70vw)}
.hero.split{grid-template-columns:1.25fr .75fr}.art{display:flex;align-items:center;justify-content:center}
.br{width:100%;max-width:420px;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ac) 50%,transparent))}
.br path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.6s .3s cubic-bezier(.4,.1,.2,1) forwards}@keyframes dr{to{stroke-dashoffset:0}}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:24px 0;margin-top:34px}
.stat>div{padding:0 24px;border-left:1px solid var(--bd)}.stat>div:first-child{border-left:0;padding-left:0}.stat .big{font-size:38px}.stat b{display:block;font:600 14px 'Space Grotesk',sans-serif}.stat p{margin:2px 0 0;color:var(--mu);font-size:13px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));position:relative;gap:8px}.tl::before{content:"";position:absolute;top:22px;left:22px;right:22px;height:1px;background:transparent}
.tl>div{position:relative;padding-right:18px}.nd2{width:44px;height:44px;border-radius:50%;border:1px solid var(--ac);background:var(--bg);display:flex;align-items:center;justify-content:center;font:500 14px 'IBM Plex Mono',monospace;color:var(--ac);box-shadow:var(--glow);margin-bottom:14px;position:relative;z-index:1}
.tl h4{font:600 16px 'Space Grotesk',sans-serif;margin:0 0 6px}.tl p{margin:0 0 10px;color:var(--mu);font-size:14px}
.fg{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--bd)}.fg>h3{font:600 14px 'Space Grotesk',sans-serif;color:var(--ac);margin:12px 0 0;letter-spacing:.02em}
.fr{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 8px;border:0;border-bottom:1px solid var(--bd);background:none;transition:padding .3s,background .3s}
.fr:hover{padding-left:20px;background:var(--p)}.fr b{display:block;font:600 15px 'Space Grotesk',sans-serif}.fr em{display:block;font-style:normal;color:var(--mu);font-size:13.5px}.fr i{font-style:normal;color:var(--ac);transition:transform .3s}.fr:hover i{transform:translateX(6px)}
.gk{columns:2 280px;column-gap:44px}.gk>div{break-inside:avoid;padding:2px 0 2px 18px;border-left:2px solid var(--ac);margin-bottom:22px}.gk b{font:600 15px 'Space Grotesk',sans-serif}.gk p{margin:2px 0 0;color:var(--mu)}
.orbs{display:flex;flex-wrap:wrap;gap:clamp(18px,5vw,56px);justify-content:center;margin:6px 0 4px}.orb{background:none;border:0;text-align:center;width:180px;transition:transform .35s}.orb:hover{transform:translateY(-5px)}.orb svg{width:158px;height:158px}
.orb .t{fill:none;stroke:var(--bd);stroke-width:7}.orb .v{fill:none;stroke:var(--ac);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;animation:og 1.5s cubic-bezier(.2,.7,.2,1)}
.orb:nth-child(2) .v{stroke:var(--v)}.orb:nth-child(3) .v{stroke:var(--ok)}@keyframes og{from{stroke-dasharray:0 314}}
.orb b{display:block;font:600 17px 'Space Grotesk',sans-serif;margin-top:4px}.orb small{display:block;color:var(--mu);font-size:13px}
@media(max-width:760px){.hero.split{grid-template-columns:1fr}.fg{grid-template-columns:1fr;gap:6px}.tl::before{display:none}.stat>div{border-left:0;padding:10px 0}}
@media(prefers-reduced-motion:reduce){.br path{stroke-dashoffset:0!important}.orb .v{animation:none!important}}
.eyebrow{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin:0 0 10px}
.ttl{font:700 clamp(30px,5vw,50px)/1.06 'Space Grotesk',Inter,sans-serif;letter-spacing:-.035em;margin:0 0 16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.step .n{font:500 30px 'IBM Plex Mono',monospace;color:var(--ac)}
.feat p{min-height:3.4em}.feat .chip{margin-top:6px}
input[type=date]{background:transparent;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit;color-scheme:dark}:root[data-theme="light"] input[type=date]{color-scheme:light}

body.focus main{grid-column:1!important;grid-row:1!important;padding:18px 16px 70px!important}
body.focus .sh{grid-template-areas:"sb"!important;grid-template-columns:minmax(0,1fr)!important;max-width:920px;margin:0 auto}
body.focus .sh .sx,body.focus .sh .rail,body.focus .sh .tabs,body.focus .sh .th{display:none!important}
body.focus .sx-b{margin-top:0!important}
body.focus .qz-wrap{max-width:780px;margin:0 auto}
.fcx{display:flex;gap:10px;align-items:center;margin-bottom:14px}

/* corner timer and music player */
.mini{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:97;width:min(380px,calc(100vw - 24px));background:var(--p2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.mini.lkd{opacity:0;pointer-events:none}
.mi-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mi-tm{display:flex;align-items:baseline;gap:8px;margin-right:auto;font-size:12.5px;color:var(--mu)}.mi-tm b{font-size:18px;color:var(--tx)}.mi-ml{margin-right:auto;font-size:12.5px;color:var(--mu)}
.mini[data-t="0"] .mi-tm,.mini[data-t="0"] #mipp,.mini[data-t="0"] #mist{display:none}.mini[data-t="1"] .mi-ml{display:none}
.mini[data-m="0"] #mimu{display:none}.mini[data-mn="1"] #mist,.mini[data-mn="1"] #miex{display:none}
.mi-mus{max-height:0;overflow:hidden;margin-top:0}.mini[data-o="1"] .mi-mus{max-height:260px;margin-top:8px}
body.exam-on .mini .mi-mus{max-height:0!important;margin-top:0!important}

:root[data-theme="light"]{--logo:var(--logo-l)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){--logo:var(--logo-l)}}
.pxl{display:inline-block;flex:none;height:28px;aspect-ratio:520/312;background:var(--logo) center/contain no-repeat}
.pxl.xs{height:22px}.pxl.lg{height:104px}
.logo{display:flex;align-items:center;gap:10px}.logo .pxl{height:26px}
#app.col .logo{display:flex;justify-content:center}#app.col .logo .lt{display:none}
@media(min-width:761px) and (max-width:1100px){#app .logo{display:flex;justify-content:center}#app .logo .lt{display:none}}
.top-lg{display:none;height:22px}
@media(max-width:760px){.top-lg{display:inline-block}}
.wm{display:flex;align-items:center;gap:16px}.wm .pxl{height:clamp(30px,5vw,46px)}
#load .pxl.lg{opacity:0;animation:fi 1s forwards}
#aub::before,#gate .c::before{content:"";display:block;height:38px;margin-bottom:12px;aspect-ratio:520/312;background:var(--logo) left center/contain no-repeat}
#ft .ft-in::before{content:"";display:block;height:34px;margin:0 auto 14px;background:var(--logo) center/contain no-repeat;opacity:.92}
#ft.ftlk .ft-in::before{background-image:var(--logo-d)}
.xbar .pxl{margin-right:2px}

/* optical centering: the mark is heavier on the right, so centred placements sit a little to the left */
#load .pxl.lg{translate:-6% 0}
#app.col .logo .pxl{translate:-6% 0}
@media(min-width:761px) and (max-width:1100px){#app .logo .pxl{translate:-6% 0}}
#ft .ft-in::before{background-position:calc(50% - 4px) center}

/* ===== Achievements + refinement layer ===== */
:root{--gd:#e8c26b;--gd2:#a77a1f;--ach-bg:#070d1a}
:root[data-theme="light"]{--gd:#9a6a0c;--gd2:#7a520a}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--gd:#9a6a0c;--gd2:#7a520a}}
h1,h2.th{font-family:'Space Grotesk','Space Grotesk',Georgia,serif;font-weight:600;letter-spacing:-.02em}
.c{box-shadow:0 1px 0 color-mix(in srgb,var(--tx) 5%,transparent) inset,0 8px 24px -14px rgba(0,0,0,.5);transition:border-color .2s,transform .2s}
.c:hover{border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.btn{background:var(--p);font-weight:500}
.btn:hover{border-color:var(--v)}
.nv.on{box-shadow:inset 3px 0 var(--ac)}
.bimg{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}
.bimg.locked{filter:grayscale(1) brightness(.3) contrast(1.15);opacity:.9}
.bimg.progress{filter:grayscale(.85) brightness(.55)}
.bimg.ready{filter:grayscale(.15) brightness(.95) drop-shadow(0 0 12px color-mix(in srgb,var(--gd) 70%,transparent))}
.bimg.earned{filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.ac{display:inline-block;font:600 11px/1 Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid;white-space:nowrap;flex:none}
.ac.locked{color:var(--mu);border-color:var(--bd)}.ac.progress{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 50%,transparent)}
.ac.ready{color:var(--gd);border-color:var(--gd);background:color-mix(in srgb,var(--gd) 12%,transparent)}.ac.earned{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.as{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;align-items:center;border:1px solid var(--bd);border-radius:16px;padding:18px 22px;background:var(--p);margin-bottom:12px}
.as-r .big{font:600 44px/1 'Space Grotesk',Georgia,serif;color:var(--gd)}.as-r small,.as-s small{display:block;color:var(--mu);font-size:12px}
.as-s{display:flex;gap:26px;flex-wrap:wrap}.as-s b{font:600 22px/1.2 'Space Grotesk',sans-serif}.as-b{grid-column:1/-1;margin-top:4px}
.as-l{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.at{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.atb{border:1px solid var(--bd);border-radius:16px;background:var(--p);padding:14px}
.atr,.atd,.abc{font:inherit;color:inherit;text-align:left;background:none;border:0;cursor:pointer}
.atr{display:flex;gap:14px;align-items:center;width:100%;padding:4px;border-radius:12px}.atr>.bimg{width:84px;flex:none}.atr>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.atn{font:600 18px/1.2 'Space Grotesk',Georgia,serif;color:var(--gd)}.atl{font-size:13px;color:var(--mu)}.atr small,.atd small{color:var(--mu);font-size:12px;display:block}
.atn-l{list-style:none;margin:10px 0 0 40px;padding:0 0 0 18px;border-left:2px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.atn-l li{position:relative}.atn-l li::before{content:"";position:absolute;left:-18px;top:34px;width:16px;border-top:2px solid var(--bd)}
.atd{display:flex;gap:12px;align-items:center;width:100%;padding:8px;border:1px solid var(--bd);border-radius:12px;background:var(--p2)}.atd>.bimg{width:56px;flex:none}.atd>span:not(.ac){flex:1;min-width:0}.atd b{font:600 14px/1.3 'Space Grotesk',sans-serif;display:block}
.atr:hover,.atd:hover,.abc:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.af{max-width:320px;margin-bottom:14px}
.al{font:600 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:14px 0 8px}
.abg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

.eyebrow{color:var(--ac)}
.as{border:1px solid var(--bd)!important}.as-r .big{color:var(--acc)}.as-s>div:nth-child(1) b{color:var(--pri)}.as-s>div:nth-child(2) b{color:var(--sec)}.as-s>div:nth-child(3) b{color:var(--acc)}.as-s>div:nth-child(4) b{color:var(--pri)}

/* ===================================================================
   v5 EDITORIAL REDESIGN LAYER
   Layout, typography, spacing and component styling only.
   Every colour below is an existing palette variable (--bg --p --p2
   --bd --tx --mu --pri --sec --acc --on). No new colours.
   =================================================================== */
:root{
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;--s5:48px;--s6:80px;--s7:120px;
  --r:6px;--rl:12px;
  --fd:'Space Grotesk','Inter',system-ui,sans-serif;
  --fb:'Inter',system-ui,-apple-system,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --fe:'DM Serif Display',Georgia,serif;
  --pad:clamp(20px,4vw,56px);
}
body{font-family:var(--fb);font-size:16px;line-height:1.6;letter-spacing:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.m{font-family:var(--fm)}
h1,h2,h3,h4{font-family:var(--fd)}
h1::after,.sh h1::after{display:none!important}
/* the 3D scenes stay, but sit quietly behind the type */
#gl{filter:opacity(.42)}

/* ---------- shared components ---------- */
.eyebrow{font:500 12px/1.4 var(--fm);letter-spacing:.02em;text-transform:none;color:var(--ac);margin:0 0 var(--s2)}
.chip{border-radius:var(--r);padding:6px 12px;font-size:13px;line-height:1.35}
.btn{border-radius:var(--r);padding:11px 20px;font:600 14px/1.2 var(--fb);letter-spacing:0;transition:filter .15s}
.btn:hover{transform:none;filter:brightness(1.08);box-shadow:none}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.nv:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],textarea,select{border-radius:var(--r);padding:11px 14px;font:400 15px/1.4 var(--fb)}
input[type=text]:focus-visible,input[type=email]:focus-visible,input[type=password]:focus-visible,input[type=number]:focus-visible,input[type=date]:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
table{font-size:14px}th{font:500 12px/1.4 var(--fm);padding:var(--s1) 12px}td{padding:12px}
.c{border-radius:var(--r);padding:var(--s3)}
.c h3{font:500 18px/1.3 var(--fd);letter-spacing:-.015em}
.c p{font-size:14.5px}
.g{gap:var(--s2)}
.g>.c:nth-child(n){border-radius:var(--r)}
.g>.c:hover{transform:none}
#pm .c,#au .c,#cmd .c,.am-card,.an-card{border-radius:var(--rl)}
.qz-f{border-radius:var(--rl)}
.opt2{border-radius:var(--r)}
.big{font-family:var(--fd)}
.tc-b,.tc-l b,.tn b,.atd b,.abc b,.fr b,.gk b,.orb b,.as-s b{font-family:var(--fd)}
/* editorial serif accent: achievement names only */
.atn,.am-h h2,.as-r .big,.tn.d b,.an-card h2,.am-e strong{font-family:var(--fe)!important;font-weight:400!important;font-synthesis:none}

/* tabs */
.tabs{gap:var(--s3);border-bottom:1px solid var(--bd);margin-bottom:var(--s4);padding-bottom:0}
.tab{padding:10px 0 12px;border-radius:0;font:500 14.5px/1.2 var(--fb);color:var(--mu);position:relative}
.tab.on{color:var(--tx);background:none}
.tab.on::after{left:0;right:0;bottom:0;height:2px}
h2.th{font:500 clamp(22px,2.2vw,30px)/1.2 var(--fd);letter-spacing:-.025em;margin:0 0 var(--s3)}
h3.sub{font:500 20px/1.3 var(--fd);letter-spacing:-.02em;margin:var(--s5) 0 var(--s2)}

/* home hero panel */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s5);padding:var(--s5) 0!important;background:transparent!important;border:0!important;border-bottom:1px solid var(--bd)!important;border-radius:0!important;box-shadow:none!important;margin-bottom:var(--s4)}
.hero h2{font:500 clamp(34px,4.6vw,68px)/1 var(--fd);letter-spacing:-.04em;margin:0 0 var(--s3)}
.hero .lead,.lead{font-size:18px;line-height:1.6}
.wm{font:300 clamp(20px,3vw,30px) var(--fd);letter-spacing:.4em;margin:0 0 var(--s3)}

/* big figures */
.stat{border:0;border-top:1px solid var(--tx);border-bottom:0;padding:0;margin-top:var(--s5);grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat>div{padding:var(--s3) var(--s3) var(--s4);border-left:1px solid var(--bd)}
.stat>div:first-child{padding-left:0;border-left:0}
.stat .big{font:500 clamp(34px,3.2vw,52px)/1 var(--fd);letter-spacing:-.04em;white-space:nowrap;margin:0 0 var(--s2)}
.stat b{font:500 15px/1.3 var(--fd)}
.stat p{font-size:13px;margin-top:4px}
.kp{gap:var(--s5);margin-top:var(--s1)}
.kp>div{min-width:0;padding:0!important;background:transparent!important;border:0!important;border-radius:0!important}
.kp b{font:500 clamp(28px,3vw,44px)/1 var(--fd);letter-spacing:-.04em}
.kp span{font:400 12px/1.4 var(--fm);color:var(--mu)}

/* ---------- landing ---------- */
.lw{max-width:1280px;padding:0 var(--pad)}
.ln{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.ln .lw{height:68px;gap:var(--s4)}
.ln a{font-size:14px;color:var(--tx);white-space:nowrap;padding:4px 0;border-bottom:1px solid transparent}
.ln a:hover{border-bottom-color:var(--tx)}
.ln .chip,.ln .btn{white-space:nowrap}
.ln .btn{padding:9px 18px}
.logo{white-space:nowrap}
.logo .lt{display:block;grid-template-columns:none;margin:0;gap:0;letter-spacing:.26em}

.lh{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--s3);row-gap:var(--s4);align-items:start;padding:var(--s6) 0 var(--s5)}
.lh-meta{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:var(--s2)}
.lh-meta .pxl{margin:0!important;height:28px!important}
.lh-meta .eyebrow{margin:0}
.lh .ttl{grid-column:1/10;grid-row:2;font:500 clamp(46px,7.4vw,112px)/.94 var(--fd);letter-spacing:-.05em;margin:0}
.lh .art{grid-column:10/-1;grid-row:2/4;align-self:stretch;justify-content:center;background:var(--p2)!important;border:1px solid var(--bd);border-radius:var(--r);padding:var(--s3)}
.lh .art .biglogo{height:clamp(64px,9vw,128px)!important}
.lh-body{grid-column:1/8;grid-row:3;background:var(--tx);color:var(--bg);padding:var(--s4);border-radius:var(--r)}
.lh-body .lead{color:var(--bg);font-size:18px;max-width:48ch}
.lh-note{grid-column:1/8;grid-row:4;margin:0;font-size:13px}

.lsec{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--s3);padding:var(--s5) 0 0;margin-top:var(--s7);border-top:1px solid var(--tx)}
.lsec>.eyebrow{grid-column:1/4;grid-row:1;margin:10px 0 0}
.lsec>h2{grid-column:4/-1;grid-row:1;font:500 clamp(34px,4.6vw,68px)/1 var(--fd);letter-spacing:-.045em;margin:0 0 var(--s3)}
.lsec>p{grid-column:4/10;grid-row:2;font-size:18px;line-height:1.55;color:var(--mu);max-width:52ch;margin:0}
.lsec>.lt,.lsec>.steps,.lsec>.pr{grid-column:1/-1}

.lt{gap:var(--s2);margin:var(--s5) 0 0}
.lt .c{padding:var(--s4);min-height:280px;gap:var(--s1)}
.lt .c h3{font:500 clamp(22px,2vw,28px)/1.15 var(--fd);letter-spacing:-.025em;margin:0}
.lt .c p{font-size:15px;max-width:38ch;margin:0}
.lt .c svg{width:auto;height:104px;max-height:none;margin:auto 0 0 auto}
.lt .c:nth-child(1){background:var(--tx)!important;color:var(--bg);border-color:var(--tx)!important}
.lt .c:nth-child(1) h3{color:var(--bg)}
.lt .c:nth-child(1) p{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.lt .c:nth-child(4){background:var(--p2)!important}

.steps{gap:var(--s3);margin-top:var(--s5)!important}
.step.c{background:transparent!important;border:0!important;border-top:1px solid var(--tx)!important;border-radius:0;padding:var(--s2) 0 0}
.step .n{font:400 clamp(40px,4vw,64px)/1 var(--fd);letter-spacing:-.04em;color:var(--pri);margin-bottom:var(--s3)}
.step h3{font:500 22px/1.2 var(--fd)}

.pr{gap:0;margin-top:var(--s5);border-top:1px solid var(--tx)}
.pr .c{background:transparent!important;border:0!important;border-right:1px solid var(--bd)!important;border-radius:0;padding:var(--s4) var(--s4) var(--s5) 0}
.pr .c:nth-child(n+2){padding-left:var(--s4)}
.pr .c:last-child{border-right:0!important;background:var(--p2)!important}
.pr .c h3{font:500 20px/1.2 var(--fd)}
.pr .big{font:500 clamp(44px,5vw,72px)/1 var(--fd);letter-spacing:-.045em;margin:var(--s3) 0 var(--s1)}
.pr .btn{margin-top:var(--s2)}

.faq>details{grid-column:4/-1;padding:var(--s3) 0;border-bottom:1px solid var(--bd)}
.faq summary{font:500 clamp(18px,1.7vw,22px)/1.3 var(--fd);letter-spacing:-.015em;list-style:none;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";float:right;font:400 26px/1 var(--fd);color:var(--mu)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{color:var(--mu);max-width:58ch;margin:var(--s2) 0 0}
.lf{display:flex;justify-content:space-between;gap:var(--s3);margin-top:var(--s7);padding:var(--s4) 0 var(--s6);font-size:13px}

#au .c,#aub{padding:var(--s4)}
#load h1{font-family:var(--fd)}

  #app.col .nv:hover{padding-left:0}

.gl::before{display:none!important}
.nv{border-radius:var(--r);font-size:14.5px;font-weight:500}
.nv i{opacity:.65;width:18px}
.nv.on{background:var(--p2)!important;box-shadow:inset 2px 0 var(--ac)!important;color:var(--tx)}
#top{height:60px;padding:0 var(--pad);gap:var(--s1);border-bottom:1px solid var(--bd)}
#top .pt{font:400 12px var(--fm);letter-spacing:0}

main{padding:var(--s5) var(--pad) 120px}
.sh{max-width:1320px;margin-inline:auto;column-gap:var(--s5);row-gap:var(--s5)}
@media(max-width:760px){main{padding:var(--s3) var(--pad) 112px}}

/* section header: type-led, unboxed */
.sh .sx{background:transparent!important;border:0!important;border-bottom:1px solid var(--tx)!important;border-radius:0!important;padding:0 0 var(--s4)!important;overflow:visible}
@media(min-width:1001px){
  .sh .sx{display:grid;grid-template-columns:minmax(0,1fr) clamp(96px,12vw,170px);gap:var(--s4);align-items:start}

}
.sx-t{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);column-gap:var(--s5);row-gap:var(--s3);align-items:end}
.sx-t .eyebrow{grid-column:1/-1;margin:0}
.sx-t h1{grid-column:1;align-self:start;margin:0;font:500 clamp(40px,5.6vw,84px)/.95 var(--fd);letter-spacing:-.045em;overflow-wrap:anywhere}
.sx-t .intro{grid-column:2;align-self:end;margin:0;font-size:16px;line-height:1.6;max-width:44ch}
.sx-t .kp{grid-column:1/-1}

.sx-a svg{max-height:120px}
.sx-a .biglogo{height:clamp(56px,7vw,100px)!important}
@media(min-width:1001px){
  .lay-c .sx-t,.lay-e .sx-t{grid-template-columns:minmax(0,1fr)}

  .lay-c .sx-t .intro,.lay-e .sx-t .intro{grid-column:1}
}
@media(max-width:900px){
  .sx-t{grid-template-columns:minmax(0,1fr)}
  .sx-t .intro{grid-column:1}
}

/* keep body flush with the header grid */
.lay-d .sx-b{margin-top:0!important;padding:0!important}

/* rail: a ledger, not a stack of cards */
.rail{gap:var(--s4)}
.rail .c{background:transparent!important;border:0!important;border-top:1px solid var(--bd)!important;border-radius:0;padding:var(--s2) 0 0}
.rail .c h3{font:500 12px/1.4 var(--fm);color:var(--mu);margin:0 0 var(--s1)}
.rail .sw{padding:10px 0}
.sc a{padding:10px 0}
.tip svg{max-height:84px}
.tip p{font-size:13.5px}

/* misc surfaces */
.as,.atb,.abc,.tr-row,.tc-r{border-radius:var(--r)!important}
.exam .sheet{border-radius:var(--r)}
.xbar{border-radius:var(--r)}
.mini{border-radius:var(--rl)}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .lh{grid-template-columns:minmax(0,1fr);padding:var(--s5) 0 var(--s4)}
  .lh>*{grid-column:1!important;grid-row:auto!important}
  .lh .ttl{font-size:clamp(44px,13vw,80px)}
  .lh .art{min-height:0}
  .lsec{margin-top:var(--s6)}
  .lsec>*{grid-column:1/-1!important;grid-row:auto!important}
  .lsec>.eyebrow{margin:0 0 var(--s2)}
  .lt{grid-template-columns:minmax(0,1fr)}.t2,.t3,.t4{grid-column:auto}
  .lt .c{min-height:0}
  .pr{border-top:0}
  .pr .c,.pr .c:nth-child(n+2){border-right:0!important;border-top:1px solid var(--tx)!important;padding:var(--s3) 0!important}
  .pr .c:last-child{padding:var(--s3) var(--s2)!important}
  .stat>div{padding:var(--s2) var(--s2) var(--s3) 0}
  .stat>div:nth-child(odd){border-left:0;padding-left:0}
  .ln .lw{gap:var(--s1) var(--s2);flex-wrap:wrap;height:auto;padding-top:12px;padding-bottom:10px}
  .ln .lw::after{content:"";order:4;flex-basis:100%;height:0}
  .ln .lw>a{order:5;font-size:13px}
  .ln .lw>a+a{margin-left:var(--s2)}
  .lf{flex-direction:column}
}
@media(max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr);padding:var(--s4) 0!important}
  .hero h2{font-size:clamp(32px,10vw,48px)}
  .kp{gap:var(--s4)}
}

64 cm/s","1.2 cm/s","8.55 cm/s"],0,6],["Two soil layers are parallel to the direction of flow. Layer 1: k1 = 10⁻³ cm/s, thickness = 2 m. Layer 2: k2 = 10⁻⁴ cm/s, thickness = 4 m. Calculate the equivalent horizontal permeability (kx).",["1.37 cm/s","6.9 cm/s","7.98 cm/s","0.0 cm/s"],3,6],["Calculate the equivalent vertical permeability (kz) for the same layers (Layer 1: k1 = 10⁻³, H1 = 2m; Layer 2: k2 = 10⁻⁴, H2 = 4m).",["2.42 cm/s","2.14 cm/s","2.65 cm/s","0.0 cm/s"],3,6],["A flow net for seepage under a dam has 4 flow channels (Nf = 4) and 12 equipotential drops (Nd = 12). If the head difference is 5 m and the soil permeability is 2x10⁻⁴ m/s, calculate the seepage per meter width of the dam.",["7.7 m³/s/m","0.0 m³/s/m","5.78 m³/s/m","2.59 m³/s/m"],1,6],["A pumping test in an unconfined aquifer reveals steady state drawdowns of 2 m and 1 m at observation wells located 10 m and 30 m from the pumping well, respectively. Pumping rate is 15 L/s. Initial aquifer thickness is 20 m. Find permeability k.",["0.0 m/s","9.49 m/s","9.45 m/s","4.66 m/s"],0,6],["What is the critical hydraulic gradient for a sand with Gs = 2.65 and void ratio e = 0.55?",["1.06","0.71","0.35","2.13"],0,6],["A soil profile consists of 3 m of dry sand (gamma_dry = 16 kN/m³) above the water table, and 4 m of saturated sand (gamma_sat = 20 kN/m³) below it. What is the total vertical stress at the bottom of the profile (depth = 7m)?",["86 kPa","128 kPa","160 kPa","64 kPa"],1,7],["For the soil profile in the previous problem, calculate the pore water pressure at depth = 7m.",["39.24 kPa","19.62 kPa","78.48 kPa","49.05 kPa"],0,7],["Calculate the effective vertical stress at the bottom of the soil profile (depth = 7m) from the previous problems.",["88.76 kPa","44.38 kPa","177.52 kPa","71.01 kPa"],0,7],["A concentrated point load of 1000 kN is applied at the ground surface. Using the Boussinesq equation, find the vertical stress increment at a depth of 5 m directly below the load.",["6.3 kPa","28.65 kPa","9.55 kPa","19.1 kPa"],3,7],["For the same 1000 kN point load, what is the vertical stress increment at a depth of 5 m and a horizontal distance of 3 m from the point of application?",["4.43 kPa","17.71 kPa","5.93 kPa","8.85 kPa"],3,7],["A circular area of radius 2 m on the ground surface is subjected to a uniform load of 100 kPa. What is the vertical stress increment at a depth of 4 m directly under the center?",["22.76 kPa","35.56 kPa","56.89 kPa","28.45 kPa"],3,7],["A wide embankment applies a uniform surcharge of 50 kPa over a very large area. What is the vertical stress increment at a depth of 10 m?",["50 kPa","34 kPa","100 kPa","25 kPa"],0,7],["In a capillary zone 1 m thick above the water table, the degree of saturation is 50%. If porosity is 0.40, calculate the negative pore water pressure (suction) midway in this zone. (Gamma_w = 9.81)",["3.4 kPa","-4.91 kPa","3.25 kPa","0.5 kPa"],1,7],["In a direct shear test on a dry sand, the normal stress is 100 kPa and the shear stress at failure is 60 kPa. Calculate the angle of internal friction.",["30.96 degrees","15.48 degrees","10.22 degrees","20.75 degrees"],0,8],["A consolidated-drained (CD) triaxial test on a sand yields a confining pressure of 150 kPa and a deviator stress at failure of 300 kPa. Calculate the major principal stress at failure.",["562 kPa","302 kPa","900 kPa","450 kPa"],3,8],["For the test in the previous problem (sigma3 = 150 kPa, sigma1 = 450 kPa), find the angle of internal friction assuming c' = 0.",["37.5 degrees","24.0 degrees","15.0 degrees","30.0 degrees"],3,8],["An unconfined compression test on a saturated clay sample yields a peak compressive stress (qu) of 120 kPa. What is the undrained shear strength (Su or cu)?",["60 kPa","48 kPa","40 kPa","30 kPa"],0,8],["A cohesive soil has c' = 20 kPa and phi' = 25°. If the effective normal stress on a failure plane is 100 kPa, what is the shear strength?",["83.29 kPa","44.64 kPa","33.32 kPa","66.63 kPa"],3,8],["In a consolidated-undrained (CU) test, cell pressure = 200 kPa, deviator stress at failure = 150 kPa, and pore water pressure at failure = 80 kPa. Calculate the effective minor principal stress.",["40 kPa","60 kPa","180 kPa","120 kPa"],3,8],["Calculate the effective major principal stress for the CU test in the previous problem.",["89 kPa","216 kPa","270 kPa","181 kPa"],2,8],["According to Mohr-Coulomb failure criterion, what is the angle of the failure plane with respect to the major principal plane for a soil with phi = 30°?",["75 degrees","20 degrees","48 degrees","60 degrees"],3,8],["A strip footing 2 m wide is placed at a depth of 1.5 m in a cohesive soil (c = 40 kPa, phi = 0, gamma = 18 kN/m³). Use Terzaghi's equation (Nc=5.7, Nq=1, Ngamma=0) to find the ultimate bearing capacity.",["510.0 kPa","382.5 kPa","255.0 kPa","170.85 kPa"],2,9],["For the footing in the previous problem, what is the net ultimate bearing capacity?",["456 kPa","228 kPa","153 kPa","342 kPa"],1,9],["If a factor of safety of 3.0 is required, calculate the net allowable bearing capacity for the footing (net ultimate = 228 kPa).",["76.0 kPa","25.08 kPa","152.0 kPa","50.92 kPa"],0,9],["Calculate the ultimate bearing capacity of a 2 m x 2 m square footing on purely cohesive soil (c = 50 kPa, Df = 1m, gamma = 17 kN/m³). Terzaghi's eq: q_ult = 1.3*c*Nc + q*Nq + 0.4*gamma*B*Ngamma (Nc=5.7, Nq=1, Ngamma=0).",["775.0 kPa","259.62 kPa","387.5 kPa","484.38 kPa"],2,9],["A circular footing of diameter 3 m rests on the surface (Df = 0) of a dry sand (c = 0, gamma = 16 kN/m³, Ngamma = 40). Find the ultimate bearing capacity (q_ult = 0.3*gamma*B*Ngamma).",["720 kPa","461 kPa","576 kPa","386 kPa"],2,9],["If the water table rises to the surface for the circular footing in the previous problem, and the saturated unit weight is 20 kN/m³, what is the new ultimate bearing capacity?",["733.68 kPa","458.55 kPa","366.84 kPa","183.42 kPa"],2,9],["A column carries a total vertical load of 1500 kN. If the allowable soil bearing capacity is 250 kPa, what is the required minimum size of a square footing?",["4.9 m","3.06 m","2.45 m","1.64 m"],2,9],["The gross allowable bearing capacity of a footing is 300 kPa. If the footing is 2 m below the ground (soil gamma = 18 kN/m³), what is the net allowable bearing capacity?",["396 kPa","264 kPa","87 kPa","132 kPa"],1,9],["A standard Proctor test yields a maximum dry unit weight of 18.5 kN/m³ at an optimum moisture content of 14%. If the specific gravity of soil solids is 2.65, what is the theoretical zero-air-voids dry unit weight at 14% moisture?",["28.44 kN/m³","18.96 kN/m³","37.92 kN/m³","23.7 kN/m³"],1,10],["A field sand cone test gives an in-situ dry unit weight of 17.2 kN/m^3. If the lab max dry unit weight is 18.5 kN/m³, calculate the relative compaction.",["30.68 %","139.46 %","92.97 %","46.49 %"],2,10],["If project specifications require 95% relative compaction, what is the minimum required in-situ dry unit weight (given max dry unit weight = 18.5 kN/m³)?",["17.57 kN/m³","5.8 kN/m³","26.36 kN/m³","21.97 kN/m³"],0,10],["Soil from a borrow pit has a natural void ratio of 0.85 and Gs = 2.70. How many cubic meters of borrow material are needed to construct a 10,000 m³ embankment with a required void ratio of 0.60?",["3815.62 m³","17343.75 m³","14453.12 m³","11562.5 m³"],3,10],["In a compaction test, the moist unit weight is 20 kN/m³ and the moisture content is 12%. Calculate the dry unit weight.",["26.79 kN/m³","5.89 kN/m³","35.71 kN/m³","17.86 kN/m³"],3,10],["An embankment requires 50,000 tons of dry soil. The borrow area soil has a moisture content of 8%. What is the total weight of wet soil to be excavated?",["81000 tons","36180 tons","27000 tons","54000 tons"],3,10],["The volume of a sand cone hole is 0.0015 m^3. The wet mass of soil extracted is 2.85 kg, with a moisture content of 10%. Calculate the in-situ dry density.",["1727.27 kg/m³","1381.82 kg/m³","2159.09 kg/m³","863.64 kg/m³"],0,10],["A 4 m thick normally consolidated clay layer has an initial void ratio of 1.0, compression index Cc = 0.30, and initial effective stress of 100 kPa. Calculate the primary consolidation settlement if the stress increases by 50 kPa.",["52.83 mm","158.48 mm","84.52 mm","105.65 mm"],3,11],["A clay soil has a liquid limit of 60. Estimate its compression index Cc using the Skempton empirical equation (Cc = 0.009*(LL - 10)).",["0.45","0.3","0.67","0.22"],0,11],["An overconsolidated clay has a preconsolidation pressure of 200 kPa. If the present effective overburden pressure is 80 kPa, calculate the Overconsolidation Ratio (OCR).",["2.5","1.68","3.75","3.12"],0,11],["In a laboratory consolidation test, a 20 mm thick specimen drained on both sides reaches 50% consolidation in 15 minutes. Calculate the coefficient of consolidation (Cv) in mm²/min. (Tv for U=50% is 0.197).",["1.31 mm²/min","1.64 mm²/min","0.66 mm²/min","2.63 mm²/min"],0,11],["Using the Cv from the previous problem (1.31 mm²/min), how long will it take for a 5 m thick field clay layer (drained on both top and bottom) to reach 50% consolidation?",["1.79 years","0.89 years","1.2 years","0.59 years"],0,11],["If U=90% corresponds to a time factor Tv = 0.848, what is the time required for 90% consolidation for the same field layer (H=5m, doubly drained, Cv=1.31 mm²/min)?",["15.39 years","9.62 years","7.7 years","5.16 years"],2,11],["Calculate the initial compression index (swell index) Cs if it is typically assumed to be 1/5 of the compression index Cc (where Cc = 0.35).",["0.07","0.02","0.1","0.05"],0,11],["A building undergoes a differential settlement of 25 mm between two columns spaced 8 m apart. Calculate the angular distortion.",["0.01","1.84","9.0","0.0"],3,11],["Calculate the Rankine active earth pressure coefficient (Ka) for a backfill soil with an angle of internal friction of 30°.",["0.67","0.11","0.27","0.33"],3,12],["Calculate the Rankine passive earth pressure coefficient (Kp) for the same soil (phi = 30°).",["2.4","1.5","0.99","3.0"],3,12],["What is the at-rest earth pressure coefficient (Ko) for a normally consolidated soil with phi = 30°? (Use Jaky's formula: Ko = 1 - sin(phi)).",["1.0","0.17","0.5","0.75"],2,12],["A 5 m high retaining wall retains a dry sand backfill (gamma = 17 kN/m³, phi = 30°, Ka = 0.333). Calculate the total active thrust per meter of wall.",["70.83 kN/m","88.53 kN/m","35.41 kN/m","106.24 kN/m"],0,12],["At what height from the base does the total active thrust (from the previous problem) act?",["1.67 m","0.83 m","2.08 m","1.33 m"],0,12],["If a uniform surcharge of 20 kPa is added to the backfill surface (from the previous problem), what is the additional active thrust per meter of wall?",["11.0 kN/m","41.66 kN/m","16.66 kN/m","33.33 kN/m"],3,12],["A cohesive backfill has an unconfined compressive strength of 40 kPa and unit weight of 18 kN/m^3. Calculate the depth of the tension crack (zc = 2c / (gamma * sqrt(Ka))). Assume phi = 0.",["1.78 m","2.78 m","2.22 m","1.49 m"],2,12]]];

try{CP=JSON.parse(localStorage.getItem('pxprof:'+UID)||'null')}catch(e){}
const eml=u=>(u&&u.email)||'',nm0=u=>((u&&u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||eml(u).split('@')[0]||'Student').slice(0,40);
function sbLoad(){if(SBR)return SBR;SBR=new Promise((res,rej)=>{const mk=()=>{try{SBC=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});res(SBC)}catch(e){rej(e)}};if(window.supabase)return mk();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=mk;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)});return SBR}
function bridgeSet(u){try{const us=USERS().filter(x=>x.id!=u.id);us.push({id:u.id,name:nm0(u),email:eml(u).toLowerCase(),cloud:1});localStorage.setItem('pxusers',JSON.stringify(us));if(!localStorage.getItem('pxme:'+u.id))localStorage.setItem('pxme:'+u.id,JSON.stringify({nick:nm0(u).replace(/[^\w.]/g,'').slice(0,16)||'Engr_Hopeful'}));localStorage.setItem('pxsession',u.id)}catch(e){}}
function bridgeClear(){try{localStorage.removeItem('pxsession')}catch(e){}}
async function cloudBoot(){if(!CLOUD)return;adminTab();try{await sbLoad()}catch(e){toast('Could not reach the sign-in service. Check your connection.');return}SBC.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>cAuth(ev,sess),0)})}
async function cAuth(ev,sess){if(ev=='PASSWORD_RECOVERY'){recoverUI();return}const u=sess&&sess.user;if(!u){if(UID&&(ev=='SIGNED_OUT'||ev=='INITIAL_SESSION')){bridgeClear();location.replace(BASE)}return}if(UID!=u.id){bridgeSet(u);location.replace(BASE);return}if(ev=='SIGNED_IN'||ev=='INITIAL_SESSION')await cSync()}
async function cSync(){if(!SBC||!UID)return;const{data:p,error}=await SBC.from('profiles').select('approved,role,nickname,full_name,email,plan,plan_until').eq('id',UID).maybeSingle();if(error||!p){if(!CP)gateShow('error');return}const was=CP&&CP.approved,pk=CP?CP.plan+'|'+CP.until+'|'+CP.role:'';CP={approved:!!p.approved,role:p.role||'user',plan:p.plan||'free',until:p.plan_until||null};try{localStorage.setItem('pxprof:'+UID,JSON.stringify(CP))}catch(e){}adminTab();if(!CP.approved){gateShow('pending');return}if(await cPull())return;gateHide();if(!was||pk!==CP.plan+'|'+CP.until+'|'+CP.role)draw();cQueue();cFlush()}
async function cPull(){const{data,error}=await SBC.from('user_state').select('state').eq('user_id',UID).maybeSingle();if(error)return false;const cs=data&&data.state;if(cs&&(cs.ts||0)>(ST.ts||0)){try{localStorage.setItem(SK,JSON.stringify(cs));if(cs._me)localStorage.setItem('pxme:'+UID,JSON.stringify(cs._me))}catch(e){return false}location.reload();return true}return false}
function cQueue(){if(!CLOUD||!SBC||!CP||!CP.approved||!UID)return;clearTimeout(CQT);CQT=setTimeout(cPush,3000)}
async function cPush(){if(!SBC||!CP||!CP.approved)return;try{await SBC.from('user_state').upsert({user_id:UID,state:{...ST,_me:me},updated_at:new Date().toISOString()});await SBC.from('profiles').update({nickname:me.nick,xp:myXP(),show_on_board:!!(ST.priv&&ST.priv.lb),last_seen:new Date().toISOString()}).eq('id',UID)}catch(e){}try{await SBC.from('profiles').update({badges:(ST.priv&&ST.priv.lb&&!me.anon)?achIdx().join(','):''}).eq('id',UID)}catch(e){}}
function cAttempt(h,l){if(!CLOUD||!SBC||!CP||!CP.approved)return;const tp={};l.forEach((q,j)=>{if(q[4]==null||!q[5]||q[5][0]!='b')return;const n=EX[q[0]].tp[q[4]],x=tp[n]=tp[n]||[0,0];x[1]++;if(RN.ok[j])x[0]++});const ss=[...new Set(l.map(q=>q[0]))],row={user_id:UID,title:h.t,subject:ss.length==1?EX[ss[0]].id:'MIXED',correct:h.c,total:h.n,seconds:h.sec||null,topics:tp};SBC.from('attempts').insert(row).then(r=>{if(r&&r.error)cQ(row)}).catch(()=>cQ(row))}
const cQ=r=>{try{const q=JSON.parse(localStorage.getItem('pxq:'+UID)||'[]');q.push(r);localStorage.setItem('pxq:'+UID,JSON.stringify(q.slice(-50)))}catch(e){}};
async function cFlush(){try{const q=JSON.parse(localStorage.getItem('pxq:'+UID)||'[]');if(!q.length)return;localStorage.removeItem('pxq:'+UID);const r=await SBC.from('attempts').insert(q);if(r&&r.error)localStorage.setItem('pxq:'+UID,JSON.stringify(q))}catch(e){}}
function cbl(){if(Date.now()-CLBT>30000){CLBT=Date.now();SBC&&SBC.rpc('get_leaderboard').then(r=>{CLB=(r&&r.data)||[];if(sec=='comp')draw()}).catch(()=>{})}return CLB}
/* gate */
function gateHide(){const g=$('#gate');if(g)g.remove()}
function gateShow(k){let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.style.cssText='position:fixed;inset:0;z-index:98;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);overflow:auto';document.body.appendChild(g)}
 const em=eml((USERS().find(u=>u.id==UID)||{})),f=CFG.registrationFormUrl;
 g.innerHTML=`<div class="c" style="max-width:540px"><h3 style="font-size:22px;margin-bottom:8px">${k=='checking'?'Checking your access…':k=='error'?'We could not check your access':'Your account is waiting for approval'}</h3>${k=='pending'?`<p>You are signed in as <b>${esc(em)}</b>. Access to Pontifex is given after you register. ${f?'Fill in the registration form with this same email, then wait for approval.':'Ask the administrator to approve this email.'}</p>`:k=='error'?'<p>Check your connection and try again. If this keeps happening, contact the administrator.</p>':'<p>One moment.</p>'}<div class="row" style="margin-top:14px">${k=='pending'&&f?`<a class="btn v" href="${esc(f)}" target="_blank" rel="noopener noreferrer">Open the registration form</a>`:''}${k!='checking'?'<button class="btn" onclick="gateRetry()">Check again</button>':''}<button class="btn" onclick="logout()">Log out</button></div></div>`}
function gateRetry(){gateShow('checking');cSync()}
/* auth screens */
const amsg=(m,ok)=>{const e=$('#aer');if(e){e.textContent=m;e.style.color=ok?'var(--ok)':''}};
function cAuthOpen(m){const f=CFG.registrationFormUrl;$('#aub').innerHTML=`<div class="ptabs"><button class="chip" onclick="authOpen('in')" style="${m=='in'?'border-color:var(--ac);color:var(--tx)':''}">Log in</button><button class="chip" onclick="authOpen('up')" style="${m=='up'?'border-color:var(--ac);color:var(--tx)':''}">Sign up</button></div><h3 style="font-size:20px">${m=='in'?'Welcome back':'Create your account'}</h3><p>${m=='in'?'Log in to continue where you left off.':'Create an account, then register so you can be approved.'}</p><button class="btn" style="width:100%" onclick="cGoogle()">Continue with Google</button><p style="text-align:center;color:var(--mu);margin:10px 0 6px">or use your email</p>${m=='up'?'<input type="text" id="an" placeholder="Your name" maxlength="40" autocomplete="name" aria-label="Name">':''}<input type="text" id="ae" placeholder="Email" autocomplete="email" aria-label="Email"><input type="password" id="ap" placeholder="Password, at least 8 characters" autocomplete="${m=='in'?'current-password':'new-password'}" aria-label="Password" style="width:100%;background:transparent;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit"><p class="err" id="aer"></p><div class="row" style="margin-top:10px"><button class="btn v" onclick="${m=='in'?'login()':'signup()'}">${m=='in'?'Log in':'Create account'}</button><button class="chip" onclick="authClose()">Cancel</button>${m=='in'?'<button class="chip" onclick="cForgot()">Forgot password?</button>':''}</div><p style="margin-top:12px;color:var(--mu);font-size:12.5px">${m=='up'&&f?'After you sign up, fill in the <a href="'+esc(f)+'" target="_blank" rel="noopener noreferrer">registration form</a> with the same email. Access is given once you are approved.':'Access is given to registered students only.'}</p>`;$('#au').classList.add('open');setTimeout(()=>{const e=$(m=='up'?'#an':'#ae');if(e)e.focus()},50)}
async function cGoogle(){try{await sbLoad();const{error}=await SBC.auth.signInWithOAuth({provider:'google',options:{redirectTo:BASE}});if(error)amsg('Google sign-in is not available right now.')}catch(e){amsg('Could not reach the sign-in service.')}}
async function cSignup(){const nm=$('#an').value.trim().slice(0,40),em=$('#ae').value.trim().toLowerCase(),pw=$('#ap').value;if(!nm)return amsg('Enter your name.');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return amsg('Enter a valid email.');if(pw.length<8)return amsg('Use at least 8 characters for your password.');try{await sbLoad();const{data,error}=await SBC.auth.signUp({email:em,password:pw,options:{data:{full_name:nm},emailRedirectTo:BASE}});if(error)return amsg(/registered|exists/i.test(error.message)?'That email already has an account. Log in instead.':'Could not create the account. '+error.message);if(data&&data.session)return;amsg('Check your email for a confirmation link, then come back here and log in.',1)}catch(e){amsg('Could not reach the sign-in service.')}}
let LF2=0;async function cLogin(){const em=$('#ae').value.trim().toLowerCase(),pw=$('#ap').value;if(LF2>=5)return amsg('Too many tries. Wait a moment and try again.');if(!em||!pw)return amsg('Enter your email and password.');try{await sbLoad();const{error}=await SBC.auth.signInWithPassword({email:em,password:pw});if(error){LF2++;setTimeout(()=>LF2=0,30000);return amsg(/confirm/i.test(error.message)?'Confirm your email first. Check your inbox for the link.':'Email or password is not right.')}}catch(e){amsg('Could not reach the sign-in service.')}}
async function cForgot(){const em=$('#ae').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return amsg('Type your email above first.');try{await sbLoad();await SBC.auth.resetPasswordForEmail(em,{redirectTo:BASE});amsg('If that email has an account, a reset link is on its way.',1)}catch(e){amsg('Could not reach the sign-in service.')}}
function recoverUI(){$('#aub').innerHTML=`<h3 style="font-size:20px">Choose a new password</h3><input type="password" id="np" placeholder="New password, at least 8 characters" autocomplete="new-password" aria-label="New password" style="width:100%;background:transparent;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit;margin-top:10px"><p class="err" id="aer"></p><div class="row" style="margin-top:10px"><button class="btn v" onclick="cNewPw()">Save password</button></div>`;$('#au').classList.add('open')}
async function cNewPw(){const p=$('#np').value;if(p.length<8)return amsg('Use at least 8 characters.');const{error}=await SBC.auth.updateUser({password:p});if(error)return amsg('Could not save. '+error.message);authClose();toast('Password updated');location.replace(BASE)}
async function cLogout(){try{await sbLoad();await SBC.auth.signOut()}catch(e){}bridgeClear();location.replace(BASE)}
/* admin */
function adminTab(){const p=S.find(x=>x[0]=='prof'),has=p[3].includes('Admin'),is=CP&&CP.approved&&CP.role=='admin';if(is&&!has){p[3].push('Admin');if(typeof nav=='function')try{nav()}catch(e){}}if(!is&&has)p[3]=p[3].filter(x=>x!='Admin')}
const adQ=async v=>{AD.busy=1;try{let r;if(v=='overview'){const wk=new Date(Date.now()-6048e5).toISOString(),c=q=>q.then(x=>x.count||0);const now=new Date().toISOString(),[a,p,t,w,pr]=await Promise.all([c(SBC.from('profiles').select('id',{count:'exact',head:true}).eq('approved',true)),c(SBC.from('profiles').select('id',{count:'exact',head:true}).eq('approved',false)),c(SBC.from('attempts').select('id',{count:'exact',head:true})),c(SBC.from('profiles').select('id',{count:'exact',head:true}).gte('last_seen',wk)),c(SBC.from('profiles').select('id',{count:'exact',head:true}).eq('plan','premium').gte('plan_until',now))]);AD.d={a,p,t,w,pr}}else if(v=='pending'||v=='users'){r=await SBC.from('profiles').select('id,email,full_name,nickname,role,approved,xp,created_at,last_seen,plan,plan_until').eq('approved',v=='users').order('created_at',{ascending:false}).limit(500);AD.d=r.data||[]}else if(v=='results'){r=await SBC.from('attempts').select('id,title,subject,correct,total,seconds,topics,created_at,profiles(email,full_name)').order('created_at',{ascending:false}).limit(400);AD.d=r.data||[]}else if(v=='access'){r=await SBC.from('access_list').select('email,note,added_at').order('added_at',{ascending:false}).limit(1000);AD.d=r.data||[]}}catch(e){AD.d=null}if(AD.d==null)AD.d=v=='overview'?{a:0,p:0,t:0,w:0,pr:0}:[];AD.busy=0;if(AD.v==v&&sec=='prof')draw()};
function adGo(v){AD.v=v;AD.d=null;adQ(v);draw()}
async function adSet(id,ok){await SBC.from('profiles').update({approved:ok}).eq('id',id);toast(ok?'Approved':'Access removed');adQ(AD.v)}
async function adPlan(id,days){const u=(AD.d||[]).find(x=>x.id==id)||{};let patch;if(!days)patch={plan:'free',plan_until:null};else{const base=Math.max(Date.now(),u.plan_until?new Date(u.plan_until).getTime():0);patch={plan:'premium',plan_until:new Date(base+days*864e5).toISOString()}}const{error}=await SBC.from('profiles').update(patch).eq('id',id);toast(error?'Could not update the plan':days?'Premium activated':'Set to free');adQ(AD.v)}
async function adAdd(){const t=$('#adl').value.toLowerCase(),em=[...new Set((t.match(/[^\s,;<>"']+@[^\s,;<>"']+\.[^\s,;<>"']+/g)||[]))];if(!em.length){toast('No emails found');return}const{error}=await SBC.from('access_list').upsert(em.map(e=>({email:e})),{onConflict:'email'});if(error){toast('Could not save the list');return}toast(em.length+' emails approved');$('#adl').value='';adQ('access')}
async function adDel(e){await SBC.from('access_list').delete().eq('email',e);adQ('access')}
function adMail(e,n){const b='Hi '+(n||'there')+',\n\nYour Pontifex account has been approved. You can now log in at '+BASE+'\n\nGood luck with your review!';open('mailto:'+encodeURIComponent(e)+'?subject='+encodeURIComponent('Your Pontifex access is ready')+'&body='+encodeURIComponent(b))}
function adminUI(){if(!(CP&&CP.approved&&CP.role=='admin'))return '<p>This page is for the administrator.</p>';const V=[['overview','Overview'],['pending','Pending'],['users','Approved users'],['results','Results'],['access','Access list']],bar=`<div class="row" style="margin-bottom:14px">${V.map(x=>`<button class="chip" onclick="adGo('${x[0]}')" style="${AD.v==x[0]?'border-color:var(--ac);color:var(--tx)':''}">${x[1]}</button>`).join('')}</div>`;if(AD.d==null&&!AD.busy)adQ(AD.v);const d=AD.d;if(d==null)return bar+'<p>Loading…</p>';const fd=t=>t?new Date(t).toLocaleDateString('en-PH',{dateStyle:'medium'}):'—';
 if(AD.v=='overview')return bar+`<div class="g">${[['Approved users',d.a],['Premium users',d.pr],['Waiting for approval',d.p],['Tests taken',d.t],['Active this week',d.w]].map(x=>`<div class="c"><p>${x[0]}</p><div class="big">${x[1]}</div></div>`).join('')}</div>`;
 if(AD.v=='pending'||AD.v=='users'){const us=AD.v=='users';return bar+`<div class="c" style="overflow-x:auto"><table><tr><th>Name</th><th>Email</th><th>Signed up</th>${us?'<th>Plan</th>':''}<th></th></tr>${d.length?d.map(u=>{const pr=u.plan=='premium'&&(!u.plan_until||new Date(u.plan_until)>Date.now());return `<tr><td>${esc(u.full_name||u.nickname||'')}${u.role=='admin'?' <span class="chip">admin</span>':''}</td><td>${esc(u.email||'')}</td><td>${fd(u.created_at)}</td>${us?`<td>${pr?'Premium'+(u.plan_until?' until '+fd(u.plan_until):''):u.plan=='premium'?'Premium ended':'Free'}</td>`:''}<td>${!us?`<button class="btn v" onclick="adSet('${u.id}',true)">Approve</button> <button class="chip" onclick="adMail('${esc(u.email)}','${esc((u.full_name||'').split(' ')[0])}')">Email</button>`:u.role=='admin'?'':`${PLANS.map(p=>`<button class="chip" onclick="adPlan('${u.id}',${p[4]})">+${p[4]>=180?'6 months':p[4]>=90?'3 months':'1 month'}</button>`).join(' ')} <button class="chip" onclick="adPlan('${u.id}',0)">Set free</button> <button class="chip" onclick="cfm('ar${u.id}',this,()=>adSet('${u.id}',false))">Remove access</button>`}</td></tr>`}).join(''):'<tr><td colspan="5">Nobody here yet.</td></tr>'}</table></div>`}
 if(AD.v=='results'){const by={},tp={};d.forEach(a=>{const b=by[a.subject]=by[a.subject]||{n:0,c:0,t:0};b.n++;b.c+=a.correct;b.t+=a.total;Object.entries(a.topics||{}).forEach(([k,v])=>{const x=tp[k]=tp[k]||[0,0];x[0]+=v[0];x[1]+=v[1]})});const weak=Object.entries(tp).filter(x=>x[1][1]>=5).map(x=>[x[0],Math.round(x[1][0]/x[1][1]*100),x[1][1]]).sort((a,b)=>a[1]-b[1]).slice(0,8);return bar+`<div class="g"><div class="c"><h3>Average by subject</h3>${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<div class="sw"><span>${esc(k)} · ${v.n} tests</span><span class="m">${v.t?Math.round(v.c/v.t*100):0}%</span></div>`).join(''):'<p>No results yet.</p>'}</div><div class="c"><h3>Weakest topics across everyone</h3>${weak.length?weak.map(x=>`<div class="sw"><span>${esc(x[0])}</span><span class="m">${x[1]}% · ${x[2]} answers</span></div>`).join(''):'<p>Needs more answers.</p>'}</div></div><div class="c" style="margin-top:16px;overflow-x:auto"><h3>Recent tests</h3><table><tr><th>Student</th><th>Test</th><th>Score</th><th>Date</th></tr>${d.slice(0,100).map(a=>`<tr><td>${esc((a.profiles&&(a.profiles.full_name||a.profiles.email))||'')}</td><td>${esc(a.title)}</td><td class="m">${a.correct}/${a.total}</td><td>${fd(a.created_at)}</td></tr>`).join('')}</table></div>`}
 if(AD.v=='access')return bar+`<div class="c"><h3>Approve emails from your registration form</h3><p>Paste the Email column from your Google Form responses (one per line, or separated by commas). Everyone listed is approved right away, and new sign-ups with these emails are approved automatically.</p><textarea id="adl" style="width:100%;min-height:110px;background:transparent;border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx);font:inherit" aria-label="Emails"></textarea><div class="row" style="margin-top:10px"><button class="btn v" onclick="adAdd()">Approve these emails</button></div></div><div class="c" style="margin-top:16px;overflow-x:auto"><h3>${d.length} approved emails</h3><table>${d.map(r=>`<tr><td>${esc(r.email)}</td><td>${fd(r.added_at)}</td><td><button class="chip" onclick="adDel('${esc(r.email)}')">Remove</button></td></tr>`).join('')}</table></div>`;return bar}
if(CLOUD){authOpen=cAuthOpen;signup=cSignup;login=cLogin;logout=cLogout}

loadContent();start();cloudBoot();
</script></body></html>
